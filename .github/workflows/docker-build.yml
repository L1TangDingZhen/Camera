name: Build Jetson Docker Image

on:
  push:
    branches: 
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-jetson:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
        with:
          platforms: arm64
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/life-tracker
          tags: |
            type=raw,value=jetson-latest
            type=raw,value=jetson-v1.0.1
            type=raw,value=v1.0.1-mediapipe
            type=sha,prefix=jetson-
      
      - name: Build and push Jetson image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.jetson
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Image digest
        run: echo "Image pushed successfully!"