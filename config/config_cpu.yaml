# Life Tracker - CPU模式配置
# 适用于：笔记本、X390、测试环境

name: "CPU Mode"
device: cpu

hardware:
  name: "CPU (笔记本/台式机)"
  note: "适合没有NVIDIA GPU的环境"

models:
  person:
    model: yolov8n.pt  # 轻量模型，CPU友好
    device: cpu
    confidence: 0.5
    iou: 0.45

  pose:
    backend: mediapipe  # CPU最优选择
    complexity: 0  # 0=Lite（最快）, 1=Full, 2=Heavy
    device: cpu
    confidence: 0.3

camera:
  source: 0  # 0=默认摄像头, 或视频文件路径
  fps: 15  # 提升到15帧以获得更好的体验
  resolution: [1280, 720]  # 720p - 平衡性能和显示质量
  flip: false
  rotation: 0

inference:
  skip_frames: 0
  detection_interval: 3  # 每N帧进行一次人体检测，中间帧复用bbox（1=每帧检测）
  max_buffer_size: 100

roi:
  zones:
    bed:
      enabled: true
      points: []  # 使用calibrate_roi.py标定
    door:
      enabled: true
      points: []
    chair:
      enabled: true
      points: []
    bathroom:
      enabled: false
      points: []

behavior:
  # 坐姿判断阈值
  sitting:
    hip_height_min: 0.3  # 相对身高
    hip_height_max: 0.6
    knee_angle_max: 120  # 度

  # 躺姿判断阈值
  lying:
    body_angle_max: 30  # 身体与水平面角度
    shoulder_hip_ratio: 0.15  # 肩膀-臀部高度差

  # 睡眠判断
  sleeping:
    still_duration: 300  # 秒，持续不动视为睡眠
    motion_threshold: 0.02  # 运动阈值

  # 事件判断
  events:
    enter_duration: 4  # 增加到4秒，减少误判（特别是侧身转向时）
    leave_duration: 3
    night_start: "22:00"
    night_end: "06:00"

storage:
  database: "data/database.db"
  backup_interval: 86400  # 秒，每天备份
  retention_days: 90  # 数据保留天数

logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  file: "logs/app.log"
  max_size: 10485760  # 10MB
  backup_count: 5
  performance_metrics: true

debug:
  # 调试模式配置
  show_keypoints: false  # 显示关键点
  show_skeleton: false   # 显示骨架
  show_angles: false     # 显示角度计算
  show_state_info: true  # 显示状态判断信息

web:
  host: "0.0.0.0"
  port: 5000
  debug: false
