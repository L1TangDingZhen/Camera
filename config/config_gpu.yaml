#
# • 结论：精度问题确实来自 FP16。重新用纯 FP32 构建了 TensorRT 引擎（models/rtmpose/mmdeploy_output_fp32/end2end.engine，用 trtexec 从 models/rtmpose/mmdeploy_work_v2/end2end.onnx 直接生成），对比结果：

#   - FP32 TRT logits vs PyTorch：x/y 平均差 ~0.0006，max <0.0045。
#   - 使用 Torch 的 head.decode 解码后，关键点均值差 0.029px，最大 0.5px，几乎一致（argmax 日志的 25px 差异是因为诊断时 x/y 交换，已确认解码后的坐标对齐）。
#   - 之前的 FP16 引擎解码均值差 ~38px，说明峰值翻转/漂移是 FP16 数值带来的。

#   说明：预处理/导出 ONNX 没问题（ONNXRuntime 与 PyTorch 完全一致）。误差只在 TensorRT FP16 推理阶段出现。

#   建议下一步：

#   1. 若继续用 FP16：在构建时强制关键层/整体使用 FP32（例如 SimCC 的 MLP/最后几层），或使用 precisionConstraints=obey + layerPrecisions 针对 MLP/输出层指定 FP32；也可直接关闭 fp16_mode 重导出。
#   2. 如果性能允许，可直接使用当前 FP32 引擎验证全流程精度；其推理延迟约 2.4ms@256x192（trtexec 实测），性能损失可接受的话是最稳的方案。
#   3. 若需再尝试 FP16，可在比较脚本里对 TRT logits 先 softmax/温度缩放再取 argmax，判断是否还能稳定峰值；若仍漂移，就固定这些层为 FP32。



# ● Performance Benchmark Analysis Report

#   Test Date: November 26, 2025
#   System: Life Tracker - Async Pipeline
#   Hardware: Jetson Orin Nano / RTX 4070
#   Model Stack: YOLOv8n (TensorRT) + RTMPose-s (PyTorch FP32) + LSTM Classifier + RL Decision Agent

#   ---
#   Executive Summary

#   This report compares performance metrics across three test scenarios:
#   1. Video Benchmark - Synchronous Mode (FHD video file, no camera hardware)
#   2. Video Benchmark - Asynchronous Mode (FHD video file, no camera hardware)
#   3. Live Camera Test - Synchronous & Asynchronous Modes (FHD 1920×1080 @ 30fps, MJPEG encoding)

#   Key Finding: Software processing times are highly consistent between video and camera tests when excluding camera I/O overhead. RTMPose pose
#   estimation remains the primary computational bottleneck at ~48-58ms per frame.

#   ---
#   Test Configuration

#   Hardware & Software Stack

#   | Component          | Specification                                   |
#   |--------------------|-------------------------------------------------|
#   | Camera Resolution  | 1920×1080 (FHD)                                 |
#   | Camera FPS Target  | 30 FPS                                          |
#   | Camera Encoding    | MJPEG (forced via cv2.CAP_PROP_FOURCC)          |
#   | Person Detection   | YOLOv8n TensorRT FP16 engine                    |
#   | Pose Estimation    | RTMPose-s PyTorch FP32 (256×192 input)          |
#   | Classifier         | LSTM + RL Decision Agent                        |
#   | Detection Interval | Every 3 frames (67% load reduction)             |
#   | Pipeline Modes     | Synchronous (serial) vs Asynchronous (4-thread) |

#   Pipeline Architecture

#   Synchronous Pipeline:
#   Camera Read → YOLO Detection → RTMPose Estimation → State Machine → Visualization

#   Asynchronous Pipeline (4 threads):
#   Thread 1: Camera Read → Queue
#   Thread 2: YOLO Detection (every 3 frames) → Queue
#   Thread 3: RTMPose Estimation → Queue
#   Thread 4: State Machine + Visualization

#   ---
#   Detailed Performance Results

#   1. Video Benchmark Results (No Camera Hardware)

#   1.1 Synchronous Mode

#   Test Conditions:
#   - Input: FHD (1920×1080) video file @ 30fps
#   - Total frames processed: 4629

#   Per-Frame Timing Breakdown:

#   | Stage          | Avg Time (ms) | % of Total | Min (ms) | Max (ms) |
#   |----------------|---------------|------------|----------|----------|
#   | Video Read     | 5.94          | 9.3%       | -        | -        |
#   | YOLO Detection | 29.13         | 45.5%      | -        | -        |
#   | RTMPose Pose   | 48.23         | 75.4%      | -        | -        |
#   | State Machine  | <1.0          | <1%        | -        | -        |
#   | Total          | 63.98         | 100%       | -        | -        |

#   Performance Metrics:
#   - Theoretical Max FPS: 15.6
#   - Primary Bottleneck: RTMPose (48.23ms, 75.4% of total time)

#   ---
#   1.2 Asynchronous Mode

#   Test Conditions:
#   - Input: FHD (1920×1080) video file @ 30fps
#   - Total frames processed: 4639

#   Per-Frame Timing Breakdown:

#   | Stage           | Avg Time (ms) | % of Total | Min (ms) | Max (ms) |
#   |-----------------|---------------|------------|----------|----------|
#   | Video Read      | 10.03         | -          | -        | -        |
#   | YOLO Detection  | 50.14         | -          | -        | -        |
#   | RTMPose Pose    | 52.19         | -          | -        | -        |
#   | State Machine   | <1.0          | -          | -        | -        |
#   | Effective Total | 54.48         | 100%       | -        | -        |

#   Performance Metrics:
#   - Theoretical Max FPS: 18.4
#   - Primary Bottleneck: RTMPose (52.19ms)
#   - CPU Usage: 27% (efficient parallel execution)
#   - Performance Gain vs Sync: +18%

#   ---
#   2. Live Camera Test Results (FHD 1920×1080)

#   2.1 Asynchronous Mode (main_async.py)

#   Test Conditions:
#   - Camera: /dev/video0, 1920×1080 @ 30 FPS, MJPEG encoding
#   - Test Duration: ~30 seconds
#   - Total frames captured: 902 (camera thread)

#   Detailed Timing Statistics:

#   | Stage          | Count | Avg (ms) | % of Total | Min (ms) | Max (ms) |
#   |----------------|-------|----------|------------|----------|----------|
#   | Camera Read    | 902   | 44.44    | 32.4%      | 23.71    | 343.53   |
#   | YOLO Detection | 294   | 34.01    | 24.8%      | 21.04    | 89.36    |
#   | RTMPose Pose   | 322   | 57.82    | 42.2%      | 46.87    | 600.11   |
#   | State Machine  | 792   | 0.70     | 0.5%       | 0.22     | 3.58     |

#   Performance Metrics:
#   - Bottleneck Stage: RTMPose (57.82ms)
#   - Theoretical Max FPS: 17.3
#   - Actual Display FPS: 30 (reported, but with frame drops)
#   - Software Processing Time (excl. camera): 92.5ms

#   Performance Distribution:
#   Camera Read:      32.4%
#   YOLO Detection:   24.8%
#   RTMPose Pose:     42.2%  ← Primary bottleneck
#   State Machine:     0.5%

#   ---
#   2.2 Synchronous Mode (main.py)

#   Test Conditions:
#   - Camera: /dev/video0, 1920×1080 @ 30 FPS, MJPEG encoding
#   - Test Duration: ~50 seconds
#   - Performance reports: 30-frame rolling averages

#   Stable State Performance (person detected):

#   | Stage          | Avg (ms)      | % of Total | Min (ms) | Max (ms) | Notes              |
#   |----------------|---------------|------------|----------|----------|--------------------|
#   | Camera Read    | 16.29-16.82   | 16.1-16.6% | 16.02    | 26.08    | Stable             |
#   | YOLO Detection | 26.10-26.87   | 25.6-26.4% | 25.77    | 28.60    | Every 3 frames     |
#   | RTMPose Pose   | 47.92-49.98   | 47.6-48.5% | 46.44    | 70.96    | Primary bottleneck |
#   | State Machine  | 0.86-0.87     | 0.8-0.9%   | 0.83     | 1.00     | Minimal            |
#   | Visualization  | 13.84-14.34   | 13.7-14.0% | 13.35    | 16.86    | UI overhead        |
#   | waitKey        | 12.33-12.41   | 12.0-12.3% | 11.57    | 12.82    | UI blocking        |
#   | Total          | 100.57-103.13 | 100%       | -        | -        | -                  |

#   Performance Metrics:
#   - Theoretical Max FPS: 9.7-9.9
#   - Total Processing Time: 100.57-103.13ms per frame
#   - Software Processing (excl. camera, UI): ~75.6ms

#   ---
#   Comparative Analysis

#   3.1 Video Test vs Camera Test (Software Processing Only)

#   Comparing pure software processing times (excluding camera I/O):

#   | Test Scenario  | YOLO (ms) | RTMPose (ms) | State (ms) | Software Total (ms) | Theoretical FPS    |
#   |----------------|-----------|--------------|------------|---------------------|--------------------|
#   | Video - Sync   | 29.13     | 48.23        | <1.0       | ~77.4               | 13.0               |
#   | Video - Async  | 50.14     | 52.19        | <1.0       | ~102 (parallel)     | 18.4 (parallel)    |
#   | Camera - Sync  | 26.44     | 48.33        | 0.87       | ~75.6               | 13.2               |
#   | Camera - Async | 34.01     | 57.82        | 0.70       | ~92.5               | 17.3 (theoretical) |

#   Key Observations:

#   1. RTMPose Consistency:
#     - Video Sync: 48.23ms
#     - Camera Sync: 48.33ms
#     - Difference: +0.2% (virtually identical)
#   2. YOLO Consistency:
#     - Video Sync: 29.13ms
#     - Camera Sync: 26.44ms
#     - Difference: -9.2% (camera test slightly faster, likely due to detection interval optimization)
#   3. Total Software Processing:
#     - Video Sync: 77.4ms
#     - Camera Sync: 75.6ms
#     - Difference: -2.3% (highly consistent)

#   ---
#   3.2 Synchronous vs Asynchronous Performance Gains

#   Video Test Comparison:

