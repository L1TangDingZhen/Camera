# Life Tracker - GPU Mode Configuration
# For: PC development, Jetson production, high-performance requirements

name: "GPU Mode"
device: cuda:0

hardware:
  name: "NVIDIA GPU (RTX/Jetson)"
  note: "Requires CUDA support"

models:
  person:
    model: models/yolov8n.engine  # TensorRT FP16 engine - 10x faster than .pt
    device: cuda:0
    confidence: 0.5
    iou: 0.45
    smooth_alpha: 0.0   # 0=off; >0 enables EMA smoothing of bbox (higher=more smooth)
    expand_ratio: 1.0   # 1=no expansion

  # ========================================================================
  # Pose Estimation Model Configuration - Model Switching Location
  # ========================================================================
  pose:
    # ===== Option 1: MediaPipe (Default, recommended for development/testing) =====
    # backend: mediapipe  # 👈 Change this to switch models!
    # complexity: 1       # 0=Lite, 1=Full, 2=Heavy
    # device: cpu         # MediaPipe only supports CPU
    # confidence: 0.3

    # Features:
    #   - Speed: ~40-50ms (CPU)
    #   - Accuracy: AP ~67%
    #   - Pros: Easy installation, good cross-platform compatibility
    #   - Use for: Windows development, quick testing
    # ========================================================

    # ===== Option 2: RTMPose (Recommended for production deployment) =====
    # ✓ TensorRT Engine (FP16) - Fixed BGR preprocessing
    backend: rtmpose
    model: rtmpose-s  # Options: rtmpose-tiny, rtmpose-s, rtmpose-m, rtmpose-l
    config_file: models/rtmpose/configs/rtmpose-s_8xb256-420e_coco-256x192.py

    # ===== Model Checkpoint Options =====
    # Model 0: legacy version (unsure, 56ms)
    # checkpoint: models/rtmpose/old_rtmpose_pytorch.pth

    # Model 1: PyTorch FP32 Official (stable baseline, 57ms)
    # checkpoint: models/rtmpose/rtmpose-s_simcc-aic-coco_pt-aic-coco_420e-256x192-fcb2599b_20230126.pth

    # Model 2: TensorRT FP32 Standalone (opset 17) - No MMDeploy needed
    checkpoint: models/rtmpose/rtmpose-s-fp32.engine
    # deploy_cfg:  # Leave empty for Standalone mode

    # Model 2.5: TensorRT FP32 Standalone (opset 11)
    # checkpoint: models/rtmpose/rtmpose-s-fp32-opset11.engine

    # Model 3: TensorRT FP32 MMDeploy (official deployment method)
    # checkpoint: models/rtmpose/mmdeploy_fp32/end2end_static.engine
    # deploy_cfg: models/rtmpose/mmdeploy_fp32/deploy.json


    device: cuda:0    # RTMPose requires GPU
    confidence: 0.3
    keypoint_min_conf: 0.3          # Lower threshold to avoid dropping points
    keypoint_smooth_alpha: 0.5      # 0=off; 0.4-0.6 recommended to smooth keypoints

    # PyTorch AMP (Automatic Mixed Precision) - Default optimization
    use_amp: false  # Disabled: Baseline FP32 performs 7.6% better than AMP on RTMPose-s

    # TensorRT configuration (advanced optimization, requires separate engine files)
    tensorrt:
      enabled: false  # Not used when loading .engine file directly
      fp16_mode: false
      workspace_size: 4096
    #
    # Features:
    #   - Speed: ~1.4ms (TensorRT FP16) - 35x faster than PyTorch!
    #   - Accuracy: AP ~68.5%
    #   - Pros: Ultimate GPU performance, minimal latency
    #   - Use for: Jetson deployment, GPU production environments
    #
    # Installation:
    #   1. pip install openmim
    #   2. mim install mmengine==0.8.0 mmcv==2.1.0 mmpose==1.1.0
    #   3. mim download mmpose --config rtmpose-s_8xb256-420e_coco-256x192 --dest models/rtmpose/
    #   4. See detailed guide: INSTALL_RTMPOSE.md
    #
    # ⚠️ Windows Users Note:
    #   - MMPose installation on Windows is complex, recommend using WSL2 or continue with MediaPipe
    #   - See INSTALL_RTMPOSE.md for details
    # ========================================================

camera:
  source: 0  # video0是彩色摄像头
  fps: 30  # GPU mode supports high frame rate
  resolution: [1920, 1080]  # FHD - MJPEG encoding enables 30FPS
  flip: false
  rotation: 0

inference:
  skip_frames: 0
  detection_interval: 3  # Detect every 3 frames (reduce YOLO load by 66%)
  pose_interval: 2       # Estimate pose every 2 frames (reduce RTMPose load by 50%)
  max_buffer_size: 150

roi:
  zones:
    bed:
      enabled: true
      points: []  # Calibrate using calibrate_roi.py
    door:
      enabled: true
      points: []
    chair:
      enabled: true
      points: []
    bathroom:
      enabled: false
      points: []

behavior:
  # Sitting posture thresholds
  sitting:
    hip_height_min: 0.3  # Relative to height
    hip_height_max: 0.6
    knee_angle_max: 120  # degrees

  # Lying posture thresholds
  lying:
    body_angle_max: 30  # Body angle to horizontal plane
    shoulder_hip_ratio: 0.15  # Shoulder-hip height difference

  # Sleep detection
  sleeping:
    still_duration: 300  # seconds, continuous stillness considered sleep
    motion_threshold: 0.02  # Motion threshold

  # Event detection
  events:
    enter_duration: 2  # Reduced to 2 seconds, minimize state transition delay
    leave_duration: 2
    night_start: "22:00"
    night_end: "06:00"

  # ========================================================================
  # Classifier Configuration - Posture Classifier Switching Location
  # ========================================================================
  classifier:
    # ===== Option 1: SVM Classifier (Default, recommended) =====
    # type: svm  # 👈 Change this to switch classifier!
    # path: models/pose_classifier_svm.pkl
    # device: cpu

    # Features:
    #   - Speed: ~1ms (CPU)
    #   - Accuracy: 90-95% (based on training data)
    #   - Pros: Fast, stable, no GPU required
    #   - Use for: Production environments, high real-time requirements
    #
    # Training:
    #   python train_svm.py --data training_data
    # ========================================================

    # ===== Option 2: Deep Learning Classifier =====
    # Uncomment lines below to enable deep learning classifier
    #
    type: deep_learning  # 👈 Change to this!
    model_type: lstm      # Options: mlp, lstm, transformer
    path: models/pose_classifier_lstm.pth
    device: cuda:0       # or cpu
    #
    # Features:
    #   - MLP: ~1ms, suitable for single-frame classification
    #   - LSTM: ~5ms, suitable for sequence data (more accurate)
    #   - Transformer: ~10ms, highest accuracy
    #   - Accuracy: Usually 2-5% higher than SVM
    #
    # Training:
    #   python train_dl.py --model mlp --epochs 100 --device cuda
    # ========================================================

    # ===== Option 3: RL Ensemble (Multi-model fusion) =====
    # Uncomment lines below to enable RL Ensemble
    #
    # type: rl_ensemble  # 👈 Change to this!
    # device: cuda:0
    # agent_path: models/ensemble_agent.pt
    #
    # # Base classifier list (at least 2)
    # ensemble_models:
    #   - type: svm
    #     path: models/pose_classifier_svm.pkl
    #
    #   - type: deep_learning
    #     model_type: mlp
    #     path: models/pose_classifier_mlp.pth
    #     device: cuda:0
    #
    #   - type: deep_learning
    #     model_type: lstm
    #     path: models/pose_classifier_lstm.pth
    #     device: cuda:0
    #
    # Features:
    #   - Dynamic weighted fusion of multiple classifiers
    #   - Adaptively adjusts weights based on environment
    #   - Accuracy: Usually 3-8% higher than single model
    #   - Use for: Accuracy priority, diverse environments
    #
    # Training:
    #   python train_ensemble.py --models svm,mlp,lstm --epochs 100
    # ========================================================

  # ========================================================================
  # Decision Strategy Configuration - Decision Strategy Switching Location
  # ========================================================================
  decision:
    # ===== Option 1: Simple Debouncing (Default) =====
    # type: simple  # 👈 Change this to switch decision strategy!

    # Features:
    #   - Time-based simple debouncing
    #   - Only output state after N seconds of stability
    #   - Fast, simple logic
    #   - Use for: Most scenarios
    # ========================================================

    # ===== Option 2: RL Adaptive Decision =====
    # Uncomment lines below to enable RL decision
    #
    type: rl  # 👈 Change to this!
    agent_path: models/decision_agent.pt
    device: cuda:0

    # Features:
    #   - Learns when to output classification results
    #   - Actions: classify_now, wait, verify, reject
    #   - Reduces false alarms, improves decision quality
    #   - Use for: Complex environments, accuracy priority
    #
    # Training:
    #   python train_decision_agent.py --classifier rule_based --epochs 100
    # ========================================================

storage:
  database: "data/database.db"
  backup_interval: 86400  # seconds, daily backup
  retention_days: 90  # days to retain data

logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  file: "logs/app.log"
  max_size: 10485760  # 10MB
  backup_count: 5
  performance_metrics: false # write yolo and rtmpose performance data to database every 60 seconds, check on web dashboard

debug:
  # Debug mode configuration
  show_keypoints: true   # Show keypoints (yellow dots on joints)
  show_skeleton: true    # Show skeleton (green lines connecting joints)
  show_angles: false     # Show angle calculations
  show_state_info: true  # Show state detection info
  performance_profiling: true  # Collect detailed timing statistics (disable in production), show after exit

web:
  host: "0.0.0.0"
  port: 5000
  debug: true

# TensorRT Optimization (Jetson)
tensorrt:
  enabled: true  # false for PC development, change to true on Jetson
  fp16_mode: true
  workspace_size: 4096  # MB


# ==============================================================================
# OPTIMIZATION HISTORY
# ==============================================================================

# ------------------------------------------------------------------------------
# [2024-11-30] TensorRT Wrapper Precision Fix
# ------------------------------------------------------------------------------
#
# Problem:
#   - TensorRT engine inference produced inaccurate keypoint predictions
#   - debug_rtmpose_alignment.py: 0.56px error (direct PyTorch vs TensorRT)
#   - tensorrt_wrapper.py path: 10-30px error (unusable)
#   - Same engine file, vastly different results - why?
#
# Root Cause:
#   The TensorRT engine was CORRECT. The problem was in tensorrt_wrapper.py's
#   preprocessing and postprocessing code - the "translation layer" between
#   raw images and the neural network.
#
# Issues Found & Fixed:
#
#   1. Missing BGR→RGB Conversion
#      - OpenCV reads BGR, but model trained on RGB
#      - Fix: Added cv2.cvtColor(warped, cv2.COLOR_BGR2RGB)
#
#   2. Missing Aspect Ratio Adjustment
#      - Original: scale = [w, h] directly
#      - MMPose: Adjusts scale to maintain 192:256 aspect ratio
#      - Fix: if w > h*0.75: scale=[w, w/0.75] else: scale=[h*0.75, h]
#
#   3. Incorrect Warp Matrix Calculation
#      - Original: Simplified 3-point transform
#      - MMPose: Uses specific get_warp_matrix() with scale[0] for direction
#      - Fix: Reimplemented exact MMPose get_warp_matrix() logic
#
#   4. Incorrect Inverse Transform
#      - Original: cv2.invertAffineTransform(trans) - accumulates numerical error
#      - MMPose: get_warp_matrix(..., inv=True) - direct computation
#      - Fix: Use inv=True parameter instead of matrix inversion
#
# Validation Results:
#   ┌────────────────────┬────────────┬────────────┬────────────┐
#   │      Comparison    │  Avg Error │ Max Error  │   Status   │
#   ├────────────────────┼────────────┼────────────┼────────────┤
#   │ PyTorch vs opset17 │  0.0147 px │  0.50 px   │  ✅ PASS   │
#   │ PyTorch vs opset11 │  0.0294 px │  0.50 px   │  ✅ PASS   │
#   │ opset17 vs opset11 │  0.0147 px │  0.50 px   │  ✅ PASS   │
#   └────────────────────┴────────────┴────────────┴────────────┘
#
# Conclusion:
#   - Both FP32 engines (opset11 and opset17) are mathematically equivalent
#   - Sub-pixel accuracy achieved (0.015px average error)
#   - tensorrt_wrapper.py now correctly matches MMPose preprocessing/postprocessing
#
# Files Modified:
#   - src/detectors/tensorrt_wrapper.py (major rewrite)
#
# Documentation:
#   - docs/TENSORRT_PRECISION_DEBUG.md (full debugging journey)
#
# Key Lesson:
#   Deep learning model accuracy depends not just on the network, but critically
#   on preprocessing and postprocessing matching the training pipeline EXACTLY.
# ------------------------------------------------------------------------------


# == Performance Notes ==
# Jetson Nano Performance (with RTMPose + LSTM Classifier + RL Decision):

# yolo v8 (vidoeo) + rtmpose (dection) + lstm (classifier) + rl (decision) = 16 fps (empty) 10 fps (human in frame) on jetson nano
# yolo v8 (tensor rt) + rtmpose (dection) + lstm (classifier) + rl (decision) = yolo v8 (pytorch 44ms -> tensort 24ms) 14 fps 
# yolo v8 (tensor rt) + rtmpose (tensor rt) + lstm (classifier) + rl (decision) = yolo v8 (pytorch 44ms -> tensort 24ms) + rtmpose (dection 67ms -> tensor rt 30ms) 14 fps 

# == RTMPose Model Options Explanation ==

# - PyTorch FP32 (.pth, MMPose path): full PyTorch/MMPose runtime, accuracy is solid, but heavy dependencies and slower (~18ms pose per frame). Good as a
#   baseline/fallback, not TensorRT.
# - Legacy FP16 TensorRT (rtmpose-s.engine): pure TensorRT but exported directly FP16 from ONNX; SimCC/preprocess mismatch caused big keypoint drift and
#   confidence collapse, with no real speed gain. Treat as unusable.
# - Current mmdeploy FP32 TensorRT (mmdeploy_output_fp32/end2end.engine): pure TensorRT, accuracy matches FP32, and in practice faster than the bad FP16
#   build (~11ms pose). This is the recommended engine now.


# == RTMPose Model Process Details ==

# - PyTorch FP32 (MMPose baseline):
#     - Model file: models/rtmpose/rtmpose-s_simcc-aic-coco_pt-aic-coco_420e-256x192-fcb2599b_20230126.pth
#     - Origin: official pretrained RTMPose-S checkpoint (no local training; download per INSTALL_RTMPOSE.md).

# - Legacy FP16 TensorRT engine (problematic):
#     - Model file: models/rtmpose/rtmpose-s.engine
#     - Built via trtexec from the plain ONNX:
#       trtexec --onnx=models/rtmpose/rtmpose-s.onnx \
#               --saveEngine=models/rtmpose/rtmpose-s.engine \
#               --fp16
#     - ONNX source: models/rtmpose/rtmpose-s.onnx (exported earlier with export_rtmpose_to_onnx.py / similar).

# - Current recommended FP32 TensorRT engine (mmdeploy export):
#     - Model file: models/rtmpose/mmdeploy_output_fp32/end2end.engine
#     - Steps:
#         1. Export ONNX with mmdeploy pipeline (working dir models/rtmpose/mmdeploy_work_v2, produces end2end.onnx).
#         2. Build FP32 engine with trtexec (no --fp16):
#             trtexec --onnx=models/rtmpose/mmdeploy_work_v2/end2end.onnx \
#                     --saveEngine=models/rtmpose/mmdeploy_output_fp32/end2end.engine
#     - This is the engine currently wired in config/config_gpu.yaml.




