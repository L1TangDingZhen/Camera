# Life Tracker - GPU Mode Configuration
# For: PC development, Jetson production, high-performance requirements

name: "GPU Mode"
device: cuda:0

hardware:
  name: "NVIDIA GPU (RTX/Jetson)"
  note: "Requires CUDA support"

models:
  person:
    model: models/yolov8n.engine  # TensorRT FP16 engine - 10x faster than .pt
    device: cuda:0
    confidence: 0.5
    iou: 0.45

  # ========================================================================
  # Pose Estimation Model Configuration - Model Switching Location
  # ========================================================================
  pose:
    # ===== Option 1: MediaPipe (Default, recommended for development/testing) =====
    # backend: mediapipe  # 👈 Change this to switch models!
    # complexity: 1       # 0=Lite, 1=Full, 2=Heavy
    # device: cpu         # MediaPipe only supports CPU
    # confidence: 0.3

    # Features:
    #   - Speed: ~40-50ms (CPU)
    #   - Accuracy: AP ~67%
    #   - Pros: Easy installation, good cross-platform compatibility
    #   - Use for: Windows development, quick testing
    # ========================================================

    # ===== Option 2: RTMPose (Recommended for production deployment) =====
    # ✓ TensorRT Engine (FP16) - Fixed BGR preprocessing
    backend: rtmpose
    model: rtmpose-s  # Options: rtmpose-tiny, rtmpose-s, rtmpose-m, rtmpose-l
    config_file: models/rtmpose/configs/rtmpose-s_8xb256-420e_coco-256x192.py
    # Stage 3: TensorRT engine (BGR fixed!)
    # checkpoint: models/rtmpose/rtmpose-s.engine
    # Stage 1: PyTorch FP32 (for comparison)
    checkpoint: models/rtmpose/rtmpose-s_simcc-aic-coco_pt-aic-coco_420e-256x192-fcb2599b_20230126.pth
    # Stage 1: PyTorch FP32 (fallback)
    # checkpoint: models/rtmpose/rtmpose-s_simcc-aic-coco_pt-aic-coco_420e-256x192-fcb2599b_20230126.pth
    device: cuda:0    # RTMPose requires GPU
    confidence: 0.3
    # TensorRT configuration
    tensorrt:
      enabled: false  # Not used when loading .engine file directly
      fp16_mode: false
      workspace_size: 4096
    #
    # Features:
    #   - Speed: ~1.4ms (TensorRT FP16) - 35x faster than PyTorch!
    #   - Accuracy: AP ~68.5%
    #   - Pros: Ultimate GPU performance, minimal latency
    #   - Use for: Jetson deployment, GPU production environments
    #
    # Installation:
    #   1. pip install openmim
    #   2. mim install mmcv==2.0.0 mmpose==1.0.0
    #   3. python download_rtmpose_models.py --model rtmpose-s
    #   4. See detailed guide: INSTALL_RTMPOSE.md
    #
    # ⚠️ Windows Users Note:
    #   - MMPose installation on Windows is complex, recommend using WSL2 or continue with MediaPipe
    #   - See INSTALL_RTMPOSE.md for details
    # ========================================================

camera:
  source: 0  # video0是彩色摄像头
  fps: 30  # GPU mode supports high frame rate
  resolution: [640, 480]  # VGA - 摄像头可达30FPS (720p只有10FPS)
  flip: false
  rotation: 0

inference:
  skip_frames: 0
  detection_interval: 2  # GPU mode detects every frame (no skipping)
  max_buffer_size: 150

roi:
  zones:
    bed:
      enabled: true
      points: []  # Calibrate using calibrate_roi.py
    door:
      enabled: true
      points: []
    chair:
      enabled: true
      points: []
    bathroom:
      enabled: false
      points: []

behavior:
  # Sitting posture thresholds
  sitting:
    hip_height_min: 0.3  # Relative to height
    hip_height_max: 0.6
    knee_angle_max: 120  # degrees

  # Lying posture thresholds
  lying:
    body_angle_max: 30  # Body angle to horizontal plane
    shoulder_hip_ratio: 0.15  # Shoulder-hip height difference

  # Sleep detection
  sleeping:
    still_duration: 300  # seconds, continuous stillness considered sleep
    motion_threshold: 0.02  # Motion threshold

  # Event detection
  events:
    enter_duration: 2  # Reduced to 2 seconds, minimize state transition delay
    leave_duration: 2
    night_start: "22:00"
    night_end: "06:00"

  # ========================================================================
  # Classifier Configuration - Posture Classifier Switching Location
  # ========================================================================
  classifier:
    # ===== Option 1: SVM Classifier (Default, recommended) =====
    # type: svm  # 👈 Change this to switch classifier!
    # path: models/pose_classifier_svm.pkl
    # device: cpu

    # Features:
    #   - Speed: ~1ms (CPU)
    #   - Accuracy: 90-95% (based on training data)
    #   - Pros: Fast, stable, no GPU required
    #   - Use for: Production environments, high real-time requirements
    #
    # Training:
    #   python train_svm.py --data training_data
    # ========================================================

    # ===== Option 2: Deep Learning Classifier =====
    # Uncomment lines below to enable deep learning classifier
    #
    type: deep_learning  # 👈 Change to this!
    model_type: lstm      # Options: mlp, lstm, transformer
    path: models/pose_classifier_lstm.pth
    device: cuda:0       # or cpu
    #
    # Features:
    #   - MLP: ~1ms, suitable for single-frame classification
    #   - LSTM: ~5ms, suitable for sequence data (more accurate)
    #   - Transformer: ~10ms, highest accuracy
    #   - Accuracy: Usually 2-5% higher than SVM
    #
    # Training:
    #   python train_dl.py --model mlp --epochs 100 --device cuda
    # ========================================================

    # ===== Option 3: RL Ensemble (Multi-model fusion) =====
    # Uncomment lines below to enable RL Ensemble
    #
    # type: rl_ensemble  # 👈 Change to this!
    # device: cuda:0
    # agent_path: models/ensemble_agent.pt
    #
    # # Base classifier list (at least 2)
    # ensemble_models:
    #   - type: svm
    #     path: models/pose_classifier_svm.pkl
    #
    #   - type: deep_learning
    #     model_type: mlp
    #     path: models/pose_classifier_mlp.pth
    #     device: cuda:0
    #
    #   - type: deep_learning
    #     model_type: lstm
    #     path: models/pose_classifier_lstm.pth
    #     device: cuda:0
    #
    # Features:
    #   - Dynamic weighted fusion of multiple classifiers
    #   - Adaptively adjusts weights based on environment
    #   - Accuracy: Usually 3-8% higher than single model
    #   - Use for: Accuracy priority, diverse environments
    #
    # Training:
    #   python train_ensemble.py --models svm,mlp,lstm --epochs 100
    # ========================================================

  # ========================================================================
  # Decision Strategy Configuration - Decision Strategy Switching Location
  # ========================================================================
  decision:
    # ===== Option 1: Simple Debouncing (Default) =====
    # type: simple  # 👈 Change this to switch decision strategy!

    # Features:
    #   - Time-based simple debouncing
    #   - Only output state after N seconds of stability
    #   - Fast, simple logic
    #   - Use for: Most scenarios
    # ========================================================

    # ===== Option 2: RL Adaptive Decision =====
    # Uncomment lines below to enable RL decision
    #
    type: rl  # 👈 Change to this!
    agent_path: models/decision_agent.pt
    device: cuda:0

    # Features:
    #   - Learns when to output classification results
    #   - Actions: classify_now, wait, verify, reject
    #   - Reduces false alarms, improves decision quality
    #   - Use for: Complex environments, accuracy priority
    #
    # Training:
    #   python train_decision_agent.py --classifier rule_based --epochs 100
    # ========================================================

storage:
  database: "data/database.db"
  backup_interval: 86400  # seconds, daily backup
  retention_days: 90  # days to retain data

logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  file: "logs/app.log"
  max_size: 10485760  # 10MB
  backup_count: 5
  performance_metrics: true

debug:
  # Debug mode configuration
  show_keypoints: false  # Show keypoints
  show_skeleton: false   # Show skeleton
  show_angles: false     # Show angle calculations
  show_state_info: true  # Show state detection info

web:
  host: "0.0.0.0"
  port: 5000
  debug: true

# TensorRT Optimization (Jetson)
tensorrt:
  enabled: true  # false for PC development, change to true on Jetson
  fp16_mode: true
  workspace_size: 4096  # MB



# yolo v8 (vidoeo) + rtmpose (dection) + lstm (classifier) + rl (decision) = 16 fps (empty) 10 fps (human in frame) on jetson nano
# yolo v8 (tensor rt) + rtmpose (dection) + lstm (classifier) + rl (decision) = yolo v8 (pytorch 44ms -> tensort 24ms) 14 fps 
# yolo v8 (tensor rt) + rtmpose (tensor rt) + lstm (classifier) + rl (decision) = yolo v8 (pytorch 44ms -> tensort 24ms) + rtmpose (dection 67ms -> tensor rt 30ms) 14 fps 
