# Life Tracker - GPU Mode Configuration (优化版)
# 针对Jetson Orin Nano优化，目标：15+ FPS

name: "GPU Mode Optimized"
device: cuda:0

hardware:
  name: "NVIDIA Jetson Orin Nano"
  note: "优化配置以获得更高FPS"

models:
  person:
    model: yolov8n.pt  # 改用YOLOv8n (更快，准确度略降)
    device: cuda:0
    confidence: 0.5
    iou: 0.45

  pose:
    backend: rtmpose
    model: rtmpose-tiny  # 改用rtmpose-tiny (速度快2倍)
    config_file: models/rtmpose/configs/rtmpose-t_8xb256-420e_coco-256x192.py
    checkpoint: models/rtmpose/rtmpose-t_simcc-aic-coco_pt-aic-coco_420e-256x192-cfc8f33d_20230126.pth
    device: cuda:0
    confidence: 0.3

camera:
  source: 0
  fps: 30
  resolution: [640, 480]  # 降低到640x480以获得30FPS
  flip: false
  rotation: 0

inference:
  skip_frames: 0
  detection_interval: 2  # 每2帧检测一次人体（节省GPU）
  max_persons: 1

behavior:
  classifier:
    type: svm
    model_path: models/pose_classifier_svm.pkl

  decision:
    type: simple
    debounce_frames: 5

  roi:
    enabled: false

database:
  path: data/database.db
  log_events: true

debug:
  show_fps: true
  show_keypoints: true
  show_bbox: true
  show_state_info: false
  performance_analysis_interval: 30
