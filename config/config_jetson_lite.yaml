# Life Tracker - Jetson Lite配置
# 适用于：低功耗需求、电池供电、演示场景
# 预期性能：45+ FPS @ 7W

name: "Jetson Orin Nano - Lite Mode"
device: cuda:0

hardware:
  name: "NVIDIA Jetson Orin Nano Super"
  power_mode: "7W"  # MAXN (15W) or 7W mode
  note: "Optimized for power efficiency"

models:
  person:
    model: yolov8n.pt  # Nano model - fastest, lowest power
    device: cuda:0
    confidence: 0.5
    iou: 0.45

  pose:
    backend: mediapipe  # Stage 1: MediaPipe (current)
    complexity: 0  # Lite mode for best performance
    device: cpu  # MediaPipe doesn't support GPU
    confidence: 0.3
    # Stage 2: Upgrade to RTMPose for GPU acceleration
    # backend: rtmpose
    # model: rtmpose-tiny  # Lightweight model
    # device: cuda:0

camera:
  source: 0  # 0=default camera, or RTSP URL
  fps: 30
  resolution: [1280, 720]  # 720p for performance
  flip: false
  rotation: 0

inference:
  skip_frames: 0
  detection_interval: 2  # Detect every 2 frames for power saving
  max_buffer_size: 150

roi:
  zones:
    bed:
      enabled: true
      points: []  # Use calibrate_roi.py to set
    door:
      enabled: true
      points: []
    chair:
      enabled: true
      points: []
    bathroom:
      enabled: false
      points: []

behavior:
  classifier:
    type: svm  # SVM classifier (train with train_svm.py)
    model_path: models/pose_classifier_svm.pkl
    # Alternative options:
    # type: deep_learning
    # type: rl_ensemble

  # Sitting posture thresholds
  sitting:
    hip_height_min: 0.3  # Relative to body height
    hip_height_max: 0.6
    knee_angle_max: 120  # degrees

  # Lying posture thresholds
  lying:
    body_angle_max: 30  # Angle with horizontal plane
    shoulder_hip_ratio: 0.15  # Shoulder-hip height difference

  # Sleeping detection
  sleeping:
    still_duration: 300  # seconds, consider sleeping if still
    motion_threshold: 0.02  # Motion threshold

  # Event detection
  events:
    enter_duration: 2  # seconds
    leave_duration: 2
    night_start: "22:00"
    night_end: "06:00"

storage:
  database: "data/database.db"
  backup_interval: 86400  # seconds, daily backup
  retention_days: 90  # Data retention period

logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  file: "logs/app.log"
  max_size: 10485760  # 10MB
  backup_count: 5
  performance_metrics: true

debug:
  show_keypoints: false
  show_skeleton: false
  show_angles: false
  show_state_info: true

web:
  host: "0.0.0.0"
  port: 5000
  debug: false

# TensorRT optimization (Jetson only)
tensorrt:
  enabled: true  # Must enable on Jetson for acceleration
  fp16_mode: true
  int8_mode: true  # Enable INT8 for maximum performance
  workspace_size: 2048  # MB (Jetson has limited memory)
