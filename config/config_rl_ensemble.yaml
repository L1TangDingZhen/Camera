# Life Tracker - RL Ensemble配置
# 适用于：多模型融合，提高分类精度

name: "RL Ensemble Mode"
device: cuda:0

hardware:
  name: "NVIDIA GPU"
  note: "需要GPU加速和训练好的多个分类器"

models:
  person:
    model: yolov8s.pt
    device: cuda:0
    confidence: 0.5
    iou: 0.45

  pose:
    backend: mediapipe  # 或 rtmpose（更快）
    complexity: 1
    device: cpu
    confidence: 0.3

camera:
  source: 0
  fps: 30
  resolution: [1280, 720]
  flip: false
  rotation: 0

inference:
  skip_frames: 0
  detection_interval: 1
  max_buffer_size: 150

roi:
  zones:
    bed:
      enabled: true
      points: []
    door:
      enabled: true
      points: []
    chair:
      enabled: true
      points: []
    bathroom:
      enabled: false
      points: []

behavior:
  sitting:
    hip_height_min: 0.3
    hip_height_max: 0.6
    knee_angle_max: 120

  lying:
    body_angle_max: 30
    shoulder_hip_ratio: 0.15

  sleeping:
    still_duration: 300
    motion_threshold: 0.02

  events:
    enter_duration: 2
    leave_duration: 2
    night_start: "22:00"
    night_end: "06:00"

  # ========================================================================
  # RL Ensemble分类器配置（多模型融合）
  # ========================================================================
  classifier:
    type: rl_ensemble  # 使用RL Ensemble
    device: cuda:0
    agent_path: models/ensemble_agent.pt  # RL融合权重

    # 基础分类器列表（至少需要2个）
    ensemble_models:
      # 基础模型1：SVM（快速、稳定）
      - type: svm
        path: models/pose_classifier_svm.pkl

      # 基础模型2：MLP（单帧深度学习）
      - type: deep_learning
        model_type: mlp
        path: models/pose_classifier_mlp.pth
        device: cuda:0

      # 基础模型3：LSTM（序列深度学习，可选）
      - type: deep_learning
        model_type: lstm
        path: models/pose_classifier_lstm.pth
        device: cuda:0

    # 注意事项：
    # 1. 所有基础分类器必须已训练好
    # 2. ensemble_agent.pt通过train_ensemble.py训练
    # 3. 推荐至少包含2-3个不同类型的分类器
    # 4. 更多模型不一定更好，3-4个最优

  # ========================================================================
  # 决策策略：使用简单防抖（不启用RL决策）
  # ========================================================================
  decision:
    type: simple  # 简单防抖决策

storage:
  database: "data/database.db"
  backup_interval: 86400
  retention_days: 90

logging:
  level: INFO
  file: "logs/app.log"
  max_size: 10485760
  backup_count: 5
  performance_metrics: true

debug:
  show_keypoints: false
  show_skeleton: false
  show_angles: false
  show_state_info: true

web:
  host: "0.0.0.0"
  port: 5000
  debug: true

tensorrt:
  enabled: false  # Ensemble不需要TensorRT
  fp16_mode: false
  workspace_size: 2048

# ========================================================================
# 使用步骤
# ========================================================================
#
# 1. 训练基础分类器：
#    python train_svm.py --data training_data
#    python train_dl.py --model mlp --epochs 100 --device cuda
#    python train_dl.py --model lstm --epochs 100 --device cuda
#
# 2. 训练Ensemble融合权重：
#    python train_ensemble.py --models svm,mlp,lstm --epochs 100 --device cuda
#
# 3. 运行系统：
#    python main.py --config config/config_rl_ensemble.yaml
#
# 4. 预期效果：
#    - 精度提升：3-8%（相比单一模型）
#    - 环境适应性更强
#    - 推理时间：基础模型中最慢的 + 2ms（融合开销）
