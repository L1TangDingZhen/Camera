# Life Tracker - RTMPose配置示例
# 适用于：GPU部署、Jetson生产环境

name: "RTMPose Mode (GPU Accelerated)"
device: cuda:0

hardware:
  name: "NVIDIA GPU / Jetson"
  note: "需要CUDA支持和MMPose安装"

models:
  person:
    model: yolov8s.pt  # 轻量模型，与RTMPose配合使用
    device: cuda:0
    confidence: 0.5
    iou: 0.45

  # ========================================================================
  # RTMPose姿态估计配置
  # ========================================================================
  pose:
    backend: rtmpose
    model: rtmpose-s  # 推荐：rtmpose-s（平衡性能和精度）

    # 模型文件路径（自动构建，通常无需修改）
    config_file: models/rtmpose/configs/rtmpose-s_8xb256-420e_coco-256x192.py
    checkpoint: models/rtmpose/rtmpose-s_simcc-aic-coco_pt-aic-coco_420e-256x192-fcb2599b_20230126.pth

    device: cuda:0
    confidence: 0.3

    # 可选模型（修改上面的model字段）：
    # - rtmpose-tiny: 最快 (~8ms), 精度稍低 (AP 65.9%)
    # - rtmpose-s:    平衡 (~12ms), 精度良好 (AP 68.6%) ⭐推荐
    # - rtmpose-m:    高精度 (~20ms), 精度更高 (AP 72.7%)
    # - rtmpose-l:    最高精度 (~35ms), 精度最高 (AP 75.3%)

camera:
  source: 0
  fps: 30
  resolution: [1280, 720]  # 720p推荐（Jetson）或 [1920, 1080] (PC GPU)
  flip: false
  rotation: 0

inference:
  skip_frames: 0
  detection_interval: 1  # GPU模式不跳帧
  max_buffer_size: 150

roi:
  zones:
    bed:
      enabled: true
      points: []
    door:
      enabled: true
      points: []
    chair:
      enabled: true
      points: []
    bathroom:
      enabled: false
      points: []

behavior:
  sitting:
    hip_height_min: 0.3
    hip_height_max: 0.6
    knee_angle_max: 120

  lying:
    body_angle_max: 30
    shoulder_hip_ratio: 0.15

  sleeping:
    still_duration: 300
    motion_threshold: 0.02

  events:
    enter_duration: 2
    leave_duration: 2
    night_start: "22:00"
    night_end: "06:00"

storage:
  database: "data/database.db"
  backup_interval: 86400
  retention_days: 90

logging:
  level: INFO
  file: "logs/app.log"
  max_size: 10485760
  backup_count: 5
  performance_metrics: true

debug:
  show_keypoints: false
  show_skeleton: false
  show_angles: false
  show_state_info: true

web:
  host: "0.0.0.0"
  port: 5000
  debug: true

# ========================================================================
# TensorRT优化配置（Jetson推荐启用）
# ========================================================================
tensorrt:
  enabled: true       # 启用TensorRT优化
  fp16_mode: true     # FP16精度（推荐）
  int8_mode: false    # INT8量化（需要校准数据）
  workspace_size: 2048  # MB

# 性能优化建议：
# - Jetson 15W模式：rtmpose-s + FP16 (~12ms, 30-40 FPS)
# - Jetson 7W模式：rtmpose-tiny + INT8 (~8ms, 60+ FPS)
# - PC GPU: rtmpose-m + FP16 (~15ms, 60+ FPS)
