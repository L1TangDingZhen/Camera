version: '3.8'

services:
  life-tracker:
    build: .
    container_name: life-tracker
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./config:/app/config
    devices:
      - /dev/video0:/dev/video0  # 映射摄像头
    environment:
      - DISPLAY=${DISPLAY}
    network_mode: host
    restart: unless-stopped
