services:
  life-tracker:
    build: .
    container_name: life-tracker
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
      - ./config:/app/config
    # 摄像头映射（仅Linux）
    # Windows/Mac用户请使用视频文件测试或修改config中的camera.source
    # devices:
    #   - /dev/video0:/dev/video0
    environment:
      - DISPLAY=${DISPLAY:-}
    ports:
      - "5000:5000"
    restart: unless-stopped
